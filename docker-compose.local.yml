services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sports_management_mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-RowingApp2026!}
      MSSQL_PID: "Developer"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sports_management_mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  backend:
    # This local environment runs under Docker Desktop on an x64 Windows host.
    # An explicit target prevents BuildKit from selecting an incompatible
    # architecture from a multi-platform Python base-image manifest.
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    depends_on:
      db:
        condition: service_healthy

volumes:
  sports_management_mssql_data:

